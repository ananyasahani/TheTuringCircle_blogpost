<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Turing Circle interactive project lab</title>
  <desc id="desc">A technical interface showing particles, graph connections, surface waves, and message passing.</desc>
  <rect width="1600" height="900" fill="#070806"/>
  <g stroke="#292c27" stroke-width="1"><path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/><path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g>
  <g fill="none" stroke="#d4af37" stroke-width="2" opacity=".7">
    <path d="M180 620L300 430 420 590 550 300 690 480 805 220"/>
    <path d="M180 620L420 590M300 430L550 300M420 590L690 480M550 300L805 220"/>
  </g>
  <g fill="#d4af37"><circle cx="180" cy="620" r="8"/><circle cx="300" cy="430" r="8"/><circle cx="420" cy="590" r="8"/><circle cx="550" cy="300" r="8"/><circle cx="690" cy="480" r="8"/><circle cx="805" cy="220" r="8"/></g>
  <g transform="translate(950 250)" fill="none" stroke="#82b9b1" stroke-width="3">
    <path d="M0 250C80 70 160 70 240 250S400 430 480 250"/>
    <path d="M0 300C80 120 160 120 240 300S400 480 480 300" opacity=".45"/>
    <path d="M0 350C80 170 160 170 240 350S400 530 480 350" opacity=".2"/>
  </g>
  <g fill="#eee9da">
    <text x="100" y="105" font-family="monospace" font-size="20">THE TURING CIRCLE / PROJECT LAB 01</text>
    <text x="100" y="205" font-family="Georgia,serif" font-size="74">Mathematics should</text>
    <text x="100" y="280" font-family="Georgia,serif" font-size="74" fill="#d4af37">move when questioned.</text>
    <text x="1000" y="750" font-family="monospace" font-size="17" fill="#82b9b1">PARTICLES · SURFACES · GRAPHS · BELIEFS</text>
  </g>
</svg>
